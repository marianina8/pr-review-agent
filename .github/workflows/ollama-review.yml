# Reusable workflow: review Go code with a local Ollama model on the GitHub runner.
#
# Call it from another repo (see README.md):
#   jobs:
#     review:
#       uses: marianina8/pr-review-agent/.github/workflows/ollama-review.yml@main
#       with: { mode: pr }
#
# mode=pr   reviews only what the pull request changes and comments on the PR.
# mode=code reviews every Go file under `target`; the review goes to the run summary.
# Either way the full report is uploaded as the `ollama-review` artifact.
name: Ollama Go review

on:
  workflow_call:
    inputs:
      mode:
        description: "pr (changed files only) or code (everything under target)"
        type: string
        default: pr
      target:
        description: "File or folder to review"
        type: string
        default: "."
      model:
        type: string
        default: "qwen2.5-coder:7b"
      num_ctx:
        description: "Context window per model call, in tokens"
        type: number
        default: 16384
      chunk_chars:
        description: "Max characters of code per model call (~3 chars per token)"
        type: number
        default: 30000
      comment:
        description: "Post or update a PR comment in pr mode"
        type: boolean
        default: true
      agent_ref:
        description: "Branch or tag of pr-review-agent to take the scripts from"
        type: string
        default: main

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    env:
      OLLAMA_MODELS: /home/runner/.ollama-models
      OUT: .go-pr-review/ci
    steps:
      - name: Check out code under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pr-review-agent scripts
        uses: actions/checkout@v4
        with:
          repository: marianina8/pr-review-agent
          ref: ${{ inputs.agent_ref }}
          path: .pr-review-agent

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama-models
          key: ollama-${{ runner.os }}-${{ inputs.model }}

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # the installer starts a system service; run our own server so models live in the cached folder
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama show "${{ inputs.model }}" > /dev/null 2>&1 || ollama pull "${{ inputs.model }}"

      - name: Collect vet, test and code
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          CHUNK_CHARS: ${{ inputs.chunk_chars }}
        run: |
          python3 .pr-review-agent/ci/collect.py --mode "$MODE" --target "$TARGET" \
            --base "$BASE" --out "$OUT" --chunk-chars "$CHUNK_CHARS"

      - name: Review with Ollama
        env:
          MODEL: ${{ inputs.model }}
          NUM_CTX: ${{ inputs.num_ctx }}
        run: |
          python3 .pr-review-agent/ci/review.py --dir "$OUT" --model "$MODEL" \
            --num-ctx "$NUM_CTX" --out "$OUT/review.md"
          cat "$OUT/review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: inputs.mode == 'pr' && inputs.comment && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MODEL: ${{ inputs.model }}
        run: |
          marker='<!-- ollama-go-review -->'
          { echo "$marker"; echo "# Ollama review (\`$MODEL\`)"; echo; head -c 60000 "$OUT/review.md"; } > "$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-review
          path: |
            .go-pr-review/ci/
            ${{ runner.temp }}/ollama.log
          if-no-files-found: ignore
