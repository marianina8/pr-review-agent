# Reusable workflow: build the Go review agent from this repo and run it on the calling repo.
#
# provider=anthropic  Claude through the Anthropic API (needs the ANTHROPIC_API_KEY secret).
# provider=bedrock    a model on Amazon Bedrock (Qwen, DeepSeek, Claude Haiku, ...), through an
#                     AWS role GitHub signs in to with OIDC (infra/github-bedrock-role.yaml).
#                     The calling workflow must grant `id-token: write`.
# provider=ollama     Ollama running on the GitHub runner itself (slow: CPU only).
#
# mode=pr   reviews what the pull request changes and comments on the PR.
# mode=code reviews everything under `target`; the review goes to the run's summary page.
# Either way the review, the agent's log and its stats are uploaded as an artifact.
name: AI code review (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "pr (the pull request's changes) or code (everything under target)"
        type: string
        default: pr
      target:
        description: "code mode: file or folder to review"
        type: string
        default: "."
      provider:
        description: "anthropic, bedrock or ollama"
        type: string
        default: anthropic
      model:
        description: "Empty = claude-sonnet-5-5 (anthropic), qwen.qwen3-coder-480b-a35b-v1:0 (bedrock), qwen2.5-coder:7b (ollama)"
        type: string
        default: ""
      max_steps:
        description: "Max model calls the agent may make"
        type: number
        default: 20
      max_output_tokens:
        description: "Max tokens the model may write per call"
        type: number
        default: 4096
      label:
        description: "Short name for this run (artifact name and PR comment), e.g. claude-sonnet-5-5"
        type: string
        default: ""
      aws_role_arn:
        description: "bedrock only: role ARN from `make bedrock-role`"
        type: string
        default: ""
      aws_region:
        description: "bedrock only"
        type: string
        default: us-west-2
      num_ctx:
        description: "ollama only: context window in tokens"
        type: number
        default: 32768
      comment:
        description: "Post or update a PR comment in pr mode"
        type: boolean
        default: true
      agent_ref:
        description: "Branch or tag of pr-review-agent to build the agent from"
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        description: "Only for provider=anthropic"
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # only used by provider=bedrock, to sign in to AWS without stored keys
    env:
      PROVIDER: ${{ inputs.provider }}
      LABEL: ${{ inputs.label }}
      MODEL: ${{ inputs.model || (inputs.provider == 'bedrock' && 'qwen.qwen3-coder-480b-a35b-v1:0') || (inputs.provider == 'ollama' && 'qwen2.5-coder:7b') || 'claude-sonnet-5-5' }}
      OLLAMA_MODELS: /home/runner/.ollama-models
      OUT: .go-pr-review/ci
    steps:
      - name: Check out code under review
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false   # keep the GitHub token out of .git/config, where scratch tests could read it

      - name: Check out pr-review-agent
        uses: actions/checkout@v7
        with:
          repository: marianina8/pr-review-agent
          ref: ${{ inputs.agent_ref }}
          path: .pr-review-agent
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # the code under review decides the Go version
          cache: false

      - name: Build the agent
        run: |
          (cd .pr-review-agent && go build -o "$RUNNER_TEMP/pr-review-agent" .)
          rm -rf .pr-review-agent   # it must not be part of the code under review
          # The agent runs go commands offline (GOPROXY=off), so fetch dependencies now.
          if [ -f go.sum ]; then go mod download; fi
          mkdir -p "$OUT"

      - name: Restore model cache
        if: inputs.provider == 'ollama'
        uses: actions/cache@v6
        with:
          path: /home/runner/.ollama-models
          key: ollama-${{ runner.os }}-${{ env.MODEL }}

      - name: Install and start Ollama
        if: inputs.provider == 'ollama'
        run: |
          echo "runner: $(nproc) CPUs, $(free -g | awk '/Mem:/{print $2}') GB RAM"
          curl -fsSL https://ollama.com/install.sh | sh
          # the installer starts a system service; run our own server so models live in the cached folder
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          if ollama show "$MODEL" > /dev/null 2>&1; then
            echo "model $MODEL restored from cache"
          else
            echo "downloading $MODEL..."
            ollama pull "$MODEL" 2>&1 | tr '\r' '\n' | awk 'NR % 50 == 1'
          fi

      - name: Check settings
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          ROLE: ${{ inputs.aws_role_arn }}
        run: |
          if [ "$PROVIDER" = anthropic ] && [ "$HAS_KEY" != true ]; then
            echo "::error::provider=anthropic needs the ANTHROPIC_API_KEY secret (gh secret set ANTHROPIC_API_KEY -R OWNER/REPO) passed to this workflow"
            exit 1
          fi
          if [ "$PROVIDER" = bedrock ] && [ -z "$ROLE" ]; then
            echo "::error::provider=bedrock needs aws_role_arn (set the BEDROCK_REVIEW_ROLE_ARN repository variable; see the pr-review-agent README)"
            exit 1
          fi

      - name: Sign in to AWS (OIDC)
        if: inputs.provider == 'bedrock'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: pr-review-${{ github.run_id }}

      - name: Review (${{ inputs.provider }} ${{ inputs.model }})
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          MAX_STEPS: ${{ inputs.max_steps }}
          MAX_TOKENS: ${{ inputs.max_output_tokens }}
          NUM_CTX: ${{ inputs.num_ctx }}
          AWS_REGION: ${{ inputs.aws_region }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "$PROVIDER" in anthropic) agent_model=claude ;; *) agent_model="$PROVIDER" ;; esac
          set +e
          "$RUNNER_TEMP/pr-review-agent" --model "$agent_model" --model-name "$MODEL" \
            --mode "$MODE" --target "$TARGET" --base "$BASE" \
            --max-steps "$MAX_STEPS" --max-tokens "$MAX_TOKENS" \
            --region "$AWS_REGION" --ollama-context "$NUM_CTX" \
            --stats "$OUT/stats.json" \
            2>&1 > "$OUT/review.md" | tee "$OUT/agent-log.txt"   # review to a file, progress to the log
          status=${PIPESTATUS[0]}
          set -e
          [ -s "$OUT/review.md" ] || echo "_The agent did not finish a review (exit code $status); see the log below._" > "$OUT/review.md"
          {
            echo "# ${LABEL:-Code review}: $PROVIDER \`$MODEL\`"
            echo
            cat "$OUT/review.md"
            echo
            echo "## Run details"
            echo
            jq -r '"| Steps | Tool calls | Input tokens | Output tokens | Seconds |\n|---|---|---|---|---|\n| \(.steps) | \(.tool_calls) | \(.usage.input_tokens) | \(.usage.output_tokens) | \(.seconds) |"' "$OUT/stats.json" 2>/dev/null || echo "(no stats)"
            echo
            echo "<details><summary>What the agent did</summary>"
            echo
            echo '```text'
            head -c 60000 "$OUT/agent-log.txt"
            echo '```'
            echo "</details>"
          } > "$OUT/report.md"
          cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Comment on the pull request
        if: always() && inputs.mode == 'pr' && inputs.comment && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$OUT/report.md" ] || exit 0
          marker="<!-- ai-code-review${LABEL:+-$LABEL} -->"
          { echo "$marker"; head -c 60000 "$OUT/report.md"; } > "$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-review${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: |
            .go-pr-review/ci/
            ${{ runner.temp }}/ollama.log
          if-no-files-found: ignore
